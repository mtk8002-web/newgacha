<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>株式会社mtk | 出世支援プログラム</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700;900&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300&family=Syne:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  /* 明るい和モダン基調 ─ クリーム＋ピンク＋金 */
  --bg: #faf6ee;          /* メイン：和紙クリーム */
  --bg-warm: #f5ede0;     /* セクション差し色：温かみクリーム */
  --bg-pink: #fbf0f3;     /* 淡ピンク背景 */
  --bg-gold: #faf2dc;     /* 淡ゴールド背景 */
  --card: #ffffff;        /* カード白 */
  --border: #e8dfc9;      /* 暖色ベージュボーダー */
  --border-soft: #f0e8d5;
  --text: #1f1b16;        /* 墨色テキスト */
  --text-muted: #7a7368;
  --text-soft: #b5ad9e;
  --pink: #d6557a;        /* メインアクセント（明背景でも読める濃さ） */
  --pink-soft: #e8638a;
  --pink-deep: #b54166;
  --pink-bg: #fcf0f3;
  --gold: #b8923f;
  --gold-bright: #d4ad55;
  --gold-deep: #8f7028;
  --gold-bg: #faf3e0;
  --silver: #9aa3ad;
  --silver-bright: #b6bdc6;
  --bronze: #b06a2e;
  --bronze-bright: #c98648;
  --danger: #b22222;
  --shadow-sm: 0 1px 2px rgba(31,27,22,0.05);
  --shadow-md: 0 6px 18px rgba(31,27,22,0.08);
  --shadow-soft: 0 8px 28px rgba(214,85,122,0.18);
  --shadow-gold: 0 8px 28px rgba(184,146,63,0.18);
  /* 旧変数（互換用：暗系で参照していた箇所が残っていても破綻しないようマップ） */
  --navy: var(--text);
  --dark: var(--text);
  --charcoal: var(--text-muted);
  --cream: var(--card);
  --gray: var(--text-muted);
  --white: var(--card);
  --pink-glow: var(--pink-bg);
  --font-jp: 'Noto Sans JP', sans-serif;
  --font-en: 'Syne', sans-serif;
  --font-serif: 'Cormorant Garamond', serif;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  font-family: var(--font-jp);
  color: var(--text);
  background: var(--bg);
  overflow-x: hidden;
  min-height: 100vh;
}

/* ===== ノイズ ===== */
body::before {
  content: ''; position: fixed; inset: 0; z-index: 9998;
  pointer-events: none; opacity: 0.025;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
}
/* 微細なグリッド（さらに薄め） */
body::after {
  content: ''; position: fixed; inset: 0; z-index: 1; pointer-events: none;
  background-image:
    linear-gradient(rgba(201,169,78,0.025) 1px, transparent 1px),
    linear-gradient(90deg, rgba(201,169,78,0.025) 1px, transparent 1px);
  background-size: 80px 80px;
  mask-image: radial-gradient(ellipse 80% 80% at 50% 20%, black 0%, transparent 100%);
}

/* ===== カスタムカーソル（明背景なので mix-blend-mode は外す） ===== */
.cursor-dot, .cursor-ring {
  position: fixed; pointer-events: none; z-index: 10000;
}
.cursor-dot {
  width: 6px; height: 6px;
  background: var(--pink); border-radius: 50%;
  transition: transform 0.1s ease;
}
.cursor-ring {
  width: 32px; height: 32px;
  border: 1.5px solid var(--pink); border-radius: 50%;
  transition: transform 0.4s cubic-bezier(0.16,1,0.3,1), width 0.3s, height 0.3s;
}
@media (max-width: 768px) { .cursor-dot, .cursor-ring { display: none; } }

/* ===== ヘッダー ===== */
header {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  height: 72px; padding: 0 3rem;
  display: flex; align-items: center; justify-content: space-between;
  transition: all 0.5s cubic-bezier(0.16,1,0.3,1);
}
header.scrolled {
  height: 60px;
  background: rgba(250,246,238,0.92);
  backdrop-filter: blur(20px) saturate(1.4);
  -webkit-backdrop-filter: blur(20px) saturate(1.4);
  box-shadow: 0 1px 0 rgba(31,27,22,0.06);
}
.logo {
  font-family: var(--font-en); font-weight: 800; font-size: 1.4rem;
  color: var(--text); letter-spacing: 0.12em; text-decoration: none;
  position: relative;
}
.logo span { color: var(--pink); }
.logo::after {
  content: '™'; font-size: 0.5rem; position: absolute; top: 0; right: -1rem;
  color: var(--pink); opacity: 0.6;
}
nav.top-nav {
  display: flex; align-items: center; gap: 0;
  background: rgba(255,255,255,0.6);
  border: 1px solid var(--border);
  border-radius: 100px;
  padding: 4px;
  box-shadow: var(--shadow-sm);
}
nav.top-nav a {
  font-family: var(--font-en); font-size: 0.66rem; font-weight: 600;
  letter-spacing: 0.12em; color: var(--text-muted);
  text-decoration: none; text-transform: uppercase;
  padding: 0.55rem 1.1rem; border-radius: 100px;
  transition: color 0.3s, background 0.3s;
}
nav.top-nav a:hover { color: var(--pink); background: var(--pink-bg); }

@media (max-width: 768px) {
  header { padding: 0 1.2rem; }
  nav.top-nav a { padding: 0.45rem 0.8rem; font-size: 0.6rem; }
}

/* ===== 昇進ティッカー ===== */
.promotion-ticker {
  position: fixed; top: 72px; left: 0; right: 0; z-index: 99;
  background: linear-gradient(90deg, rgba(232,99,138,0.95), rgba(201,78,122,0.95));
  color: var(--white); padding: 0.7rem 1.5rem;
  text-align: center;
  font-size: 0.85rem; font-weight: 500;
  letter-spacing: 0.05em;
  transform: translateY(-100%);
  transition: transform 0.5s cubic-bezier(0.16,1,0.3,1);
  box-shadow: 0 4px 20px rgba(232,99,138,0.4);
  backdrop-filter: blur(10px);
}
.promotion-ticker.show { transform: translateY(0); }
.promotion-ticker .star { color: var(--gold-bright); margin: 0 0.4rem; }
.promotion-ticker .name { color: var(--gold-bright); font-weight: 700; }

/* ===== ヒーロー ===== */
.hero {
  position: relative;
  background: linear-gradient(180deg, var(--bg-warm) 0%, var(--bg) 100%);
  display: flex; align-items: center; overflow: hidden;
  padding: 110px 0 70px;
}
.hero-bg {
  position: absolute; inset: 0;
  background:
    radial-gradient(ellipse 60% 50% at 80% 30%, rgba(214,85,122,0.18) 0%, transparent 70%),
    radial-gradient(ellipse 50% 60% at 15% 80%, rgba(184,146,63,0.18) 0%, transparent 70%);
}
.hero-bg-image {
  position: absolute; inset: 0;
  background-size: cover; background-position: center;
  opacity: 0.5;
  display: none; /* 画像が設定されている時のみ表示 */
}
.hero-bg-image.active { display: block; }
.hero-bg-overlay {
  position: absolute; inset: 0;
  background: linear-gradient(180deg, rgba(250,246,238,0.6) 0%, rgba(250,246,238,0.92) 80%, var(--bg) 100%);
  display: none;
}
.hero-bg-image.active + .hero-bg-overlay { display: block; }
.hero-line-h, .hero-line-v { position: absolute; background: rgba(31,27,22,0.04); }
.hero-line-h { height: 1px; width: 100%; }
.hero-line-v { width: 1px; height: 100%; }

.hero-inner {
  position: relative; z-index: 2;
  display: flex; flex-direction: column; align-items: center;
  gap: 1.6rem; text-align: center;
  max-width: 1100px; margin: 0 auto; padding: 0 2rem; width: 100%;
  /* サーバから設定取得が終わるまでハードコード文言を見せない */
  opacity: 0;
  transition: opacity 0.4s ease-out;
}
.hero-inner.loaded { opacity: 1; }

.hero-label {
  font-family: var(--font-en); font-size: 0.65rem; font-weight: 700;
  letter-spacing: 0.5em; color: var(--pink); margin-bottom: 0.4rem;
  text-transform: uppercase;
}
.hero-event-name {
  font-family: var(--font-jp); font-size: clamp(1.8rem, 4vw, 2.8rem);
  font-weight: 900; color: var(--text); line-height: 1.3;
  letter-spacing: 0.05em; margin-bottom: 0.6rem;
}
.hero-event-en {
  font-family: var(--font-serif); font-style: italic; font-weight: 300;
  font-size: clamp(2.2rem, 5vw, 3.6rem);
  color: rgba(214,85,122,0.28); line-height: 1; margin-bottom: 1.4rem;
  letter-spacing: -0.01em;
}
.countdown {
  display: flex; gap: 1rem; flex-wrap: wrap;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 1.2rem 1.6rem;
  margin-top: 0.6rem;
  max-width: 100%;
  box-shadow: var(--shadow-sm);
}
.countdown-unit { display: flex; flex-direction: column; align-items: center; min-width: 56px; }
.countdown-num {
  font-family: var(--font-en); font-size: 2.1rem; font-weight: 800;
  color: var(--text); line-height: 1;
  font-variant-numeric: tabular-nums;
}
.countdown-label {
  font-family: var(--font-en); font-size: 0.55rem; font-weight: 600;
  letter-spacing: 0.3em; color: var(--text-muted);
  margin-top: 0.55rem; text-transform: uppercase;
}
.countdown-sep {
  font-family: var(--font-en); font-size: 1.4rem; color: var(--pink); opacity: 0.5;
  align-self: flex-start; margin-top: 0.2rem;
}
.countdown.ended .countdown-num { color: var(--pink); }

/* ===== トップ社員（1位） ===== */
.hero-right { position: relative; }
.top-card {
  position: relative;
  background: linear-gradient(145deg, rgba(232,99,138,0.08), rgba(201,169,78,0.04));
  border: 1px solid rgba(232,99,138,0.25);
  border-radius: 6px;
  padding: 2.5rem 2rem;
  text-align: center;
  overflow: hidden;
}
.top-card::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px;
  background: linear-gradient(90deg, transparent, var(--pink), transparent);
}
.top-card .corner {
  position: absolute; width: 40px; height: 40px;
  border-color: var(--gold); opacity: 0.5;
}
.top-card .corner.tl { top: 8px; left: 8px; border-top: 1px solid; border-left: 1px solid; }
.top-card .corner.tr { top: 8px; right: 8px; border-top: 1px solid; border-right: 1px solid; }
.top-card .corner.bl { bottom: 8px; left: 8px; border-bottom: 1px solid; border-left: 1px solid; }
.top-card .corner.br { bottom: 8px; right: 8px; border-bottom: 1px solid; border-right: 1px solid; }
.top-card-label {
  font-family: var(--font-en); font-size: 0.6rem; font-weight: 700;
  letter-spacing: 0.5em; color: var(--gold); margin-bottom: 1.4rem;
  text-transform: uppercase;
}
.top-card-icon {
  width: 130px; height: 130px;
  margin: 0 auto 1.4rem;
  border-radius: 50%; overflow: hidden;
  background: var(--charcoal);
  border: 2px solid var(--gold);
  display: flex; align-items: center; justify-content: center;
  font-size: 4.5rem; line-height: 1;
  box-shadow: 0 0 32px rgba(232,99,138,0.3), inset 0 0 16px rgba(0,0,0,0.4);
}
.top-card-icon img { width: 100%; height: 100%; object-fit: cover; }
.top-card-name {
  font-size: 1.5rem; font-weight: 700; color: var(--white);
  letter-spacing: 0.08em; margin-bottom: 0.4rem;
}
.top-card-rank {
  display: inline-block;
  font-family: var(--font-en); font-size: 0.7rem; font-weight: 700;
  letter-spacing: 0.25em; text-transform: uppercase;
  color: var(--pink); border: 1px solid var(--pink);
  padding: 0.3rem 1rem; margin-bottom: 1.2rem;
}
.top-card-rank-jp {
  font-family: var(--font-jp); font-size: 0.9rem; font-weight: 600;
  color: var(--gold-bright); letter-spacing: 0.15em; margin-bottom: 1.2rem;
  display: inline-flex; align-items: center; gap: 8px; justify-content: center;
}
.top-card-rank-jp .reward-mini {
  width: 22px; height: 22px;
  border-radius: 5px; overflow: hidden;
  display: inline-flex; align-items: center; justify-content: center;
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(201,169,78,0.4);
  font-size: 1rem; line-height: 1;
}
.top-card-rank-jp .reward-mini img { width: 100%; height: 100%; object-fit: cover; }
.top-card-spoon {
  font-family: var(--font-en); font-size: 2.6rem; font-weight: 800;
  color: var(--gold); letter-spacing: 0.02em; line-height: 1;
  font-variant-numeric: tabular-nums;
}
.top-card-spoon .unit {
  font-size: 0.8rem; color: var(--gold); margin-left: 0.3rem; font-weight: 600;
  letter-spacing: 0.2em;
}
.top-card.empty {
  border-color: rgba(255,255,255,0.08);
  background: rgba(255,255,255,0.02);
}
.top-card.empty .top-card-empty-msg {
  font-family: var(--font-jp); color: rgba(255,255,255,0.4);
  font-size: 0.9rem; padding: 3rem 0;
}

/* ===== セクション共通 ===== */
section { padding: 8rem 0; position: relative; z-index: 2; }
.container { max-width: 1100px; margin: 0 auto; padding: 0 2rem; }
.section-label {
  font-family: var(--font-en); font-size: 0.65rem; font-weight: 700;
  letter-spacing: 0.5em; color: var(--pink); text-transform: uppercase;
  display: flex; align-items: center; gap: 1rem; margin-bottom: 1rem;
}
.section-label::before { content: ''; width: 30px; height: 1px; background: var(--pink); }
.section-title-en {
  font-family: var(--font-serif); font-size: clamp(2.5rem, 5vw, 4rem);
  font-weight: 300; font-style: italic; color: rgba(214,85,122,0.18);
  line-height: 1; margin-bottom: 0.4rem; letter-spacing: -0.01em;
}
.section-title {
  font-size: 1.7rem; font-weight: 900; line-height: 1.5;
  margin-bottom: 2.4rem; letter-spacing: 0.06em; color: var(--text);
}
@media (max-width: 600px) { section { padding: 5rem 0; } }

/* ===== ランキング ===== */
.ranking-section { background: linear-gradient(180deg, var(--bg) 0%, var(--bg-warm) 100%); }

/* === 表彰台（1〜3位）=== */
.podium {
  display: flex;
  flex-wrap: nowrap;
  gap: 1rem;
  align-items: end;
  justify-content: center;
  margin-bottom: 2.6rem;
  margin-top: 0.5rem;
}
.podium-card { flex: 1 1 0; min-width: 0; max-width: 320px; }
.podium-card.gold { flex: 1.35 1 0; max-width: 380px; }
.podium-card {
  position: relative;
  background: var(--card);
  border: 1.5px solid var(--border);
  border-radius: 12px;
  padding: 2rem 1.2rem 1.4rem;
  text-align: center;
  overflow: hidden;
  transition: transform 0.25s cubic-bezier(0.16,1,0.3,1), box-shadow 0.25s;
  box-shadow: var(--shadow-sm);
}
.podium-card::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
  background: currentColor; opacity: 0.7;
}
.podium-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-md); }
.podium-card.gold {
  color: var(--gold);
  border-color: rgba(184,146,63,0.55);
  background: linear-gradient(180deg, var(--gold-bg), var(--card));
  padding: 3rem 1.4rem 1.6rem;
  box-shadow: var(--shadow-gold);
}
.podium-card.silver {
  color: var(--silver);
  border-color: rgba(154,163,173,0.55);
  background: linear-gradient(180deg, #f1f3f6, var(--card));
  padding: 2.4rem 1.2rem 1.4rem;
}
.podium-card.bronze {
  color: var(--bronze);
  border-color: rgba(176,106,46,0.55);
  background: linear-gradient(180deg, #faece1, var(--card));
  padding: 2.4rem 1.2rem 1.4rem;
}
.podium-medal {
  font-size: 2.4rem;
  line-height: 1;
  margin-bottom: 0.6rem;
  filter: drop-shadow(0 2px 6px rgba(0,0,0,0.35));
}
.podium-card.gold .podium-medal { font-size: 2.8rem; }
.podium-position-en {
  font-family: var(--font-en); font-size: 0.6rem; font-weight: 700;
  letter-spacing: 0.4em; text-transform: uppercase;
  color: currentColor;
  margin-bottom: 0.6rem;
  opacity: 0.85;
}
.podium-icon {
  width: 80px; height: 80px;
  margin: 0 auto 1rem;
  border-radius: 50%; overflow: hidden;
  background: var(--bg-warm);
  border: 2px solid currentColor;
  display: flex; align-items: center; justify-content: center;
  font-size: 2.6rem;
}
.podium-card.gold .podium-icon {
  width: 110px; height: 110px;
  font-size: 3.6rem;
  border-width: 3px;
  box-shadow: 0 0 30px rgba(184,146,63,0.3);
}
.podium-icon img { width: 100%; height: 100%; object-fit: cover; }
.podium-name {
  font-size: 1.05rem; font-weight: 700;
  color: var(--text);
  letter-spacing: 0.06em;
  margin-bottom: 0.6rem;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.podium-card.gold .podium-name { font-size: 1.3rem; }
.podium-rank {
  display: inline-flex; align-items: center; gap: 8px; justify-content: center;
  font-size: 1.4rem; font-weight: 900;
  color: var(--text);
  letter-spacing: 0.1em;
  margin-bottom: 0.5rem;
  line-height: 1.2;
}
.podium-card.gold .podium-rank { font-size: 1.85rem; color: var(--gold-deep); }
.podium-card.silver .podium-rank { color: #5e6670; }
.podium-card.bronze .podium-rank { color: #8a4d20; }
.podium-rank .reward-mini {
  width: 28px; height: 28px;
  border-radius: 6px; overflow: hidden;
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--card);
  border: 1px solid currentColor;
  font-size: 1.3rem; line-height: 1;
}
.podium-card.gold .podium-rank .reward-mini { width: 34px; height: 34px; font-size: 1.5rem; }
.podium-rank .reward-mini img { width: 100%; height: 100%; object-fit: cover; }
.podium-spoon {
  font-family: var(--font-en); font-size: 1.5rem; font-weight: 800;
  color: var(--text);
  letter-spacing: 0.02em;
  font-variant-numeric: tabular-nums;
  line-height: 1;
}
.podium-card.gold .podium-spoon { font-size: 2rem; }
.podium-spoon .unit { font-size: 0.62rem; color: var(--pink); margin-left: 0.3rem; letter-spacing: 0.2em; font-weight: 600; }
.podium-base {
  margin-top: 1rem;
  padding-top: 0.8rem;
  border-top: 1px solid var(--border);
  font-family: var(--font-en); font-weight: 800;
  font-size: 1.6rem;
  color: currentColor;
  letter-spacing: 0.05em;
  line-height: 1;
  text-transform: uppercase;
}
.podium-card.gold .podium-base { font-size: 2.2rem; }
.podium-base .small {
  font-size: 0.55rem; letter-spacing: 0.3em;
  color: var(--text-soft); display: block;
  margin-bottom: 0.3rem; font-weight: 600;
}

/* タブレット〜スマホ：1〜3位を縦に積む */
@media (max-width: 860px) {
  .podium { flex-direction: column; gap: 0.8rem; align-items: stretch; }
  .podium-card,
  .podium-card.gold,
  .podium-card.silver,
  .podium-card.bronze { max-width: 100%; flex: 1 1 auto; }
  .podium-card.gold { padding: 2rem 1.2rem 1.2rem; order: -1; }
  .podium-card.gold .podium-icon { width: 90px; height: 90px; font-size: 3rem; }
  .podium-card.gold .podium-rank { font-size: 1.5rem; }
  .podium-card.gold .podium-name { font-size: 1.15rem; }
  .podium-card.gold .podium-spoon { font-size: 1.7rem; }
  .podium-card.gold .podium-base { font-size: 1.8rem; }
}
@media (max-width: 480px) {
  .podium-card { padding: 1.4rem 1rem 1.2rem; }
  .podium-card.gold { padding: 1.6rem 1rem 1.2rem; }
  .podium-icon { width: 64px; height: 64px; font-size: 2rem; }
  .podium-card.gold .podium-icon { width: 76px; height: 76px; font-size: 2.4rem; }
  .podium-name { font-size: 1rem; }
  .podium-spoon { font-size: 1.3rem; }
  .podium-card.gold .podium-spoon { font-size: 1.5rem; }
  .podium-base { font-size: 1.3rem; padding-top: 0.6rem; margin-top: 0.7rem; }
  .podium-card.gold .podium-base { font-size: 1.5rem; }
  .podium-medal { font-size: 1.9rem; }
  .podium-card.gold .podium-medal { font-size: 2.2rem; }
}

.ranking-list {
  display: flex; flex-direction: column; gap: 0.6rem;
}
.ranking-list-label {
  font-family: var(--font-en); font-size: 0.6rem; font-weight: 700;
  letter-spacing: 0.4em; color: var(--text-muted);
  text-transform: uppercase; margin-bottom: 0.8rem;
  display: flex; align-items: center; gap: 1rem;
}
.ranking-list-label::before, .ranking-list-label::after {
  content: ''; flex: 1; height: 1px; background: var(--border);
}
.rank-row {
  display: grid;
  grid-template-columns: 70px 56px 1fr auto auto;
  gap: 1.4rem;
  align-items: center;
  background: var(--card);
  border: 1px solid var(--border);
  padding: 1.1rem 1.6rem;
  border-radius: 8px;
  transition: all 0.25s cubic-bezier(0.16,1,0.3,1);
  position: relative; overflow: hidden;
  box-shadow: var(--shadow-sm);
}
.rank-row:hover {
  border-color: var(--pink);
  background: var(--pink-bg);
  transform: translateX(4px);
}
.rank-position {
  font-family: var(--font-en); font-size: 2rem; font-weight: 800;
  color: var(--text); line-height: 1; text-align: center;
  font-variant-numeric: tabular-nums;
}
.rank-position .ord { font-size: 0.55rem; vertical-align: super; opacity: 0.7; color: var(--text-muted); }

.rank-icon {
  width: 56px; height: 56px;
  border-radius: 50%; overflow: hidden;
  background: var(--bg-warm);
  border: 1.5px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  font-size: 2rem; flex-shrink: 0;
}
.rank-icon img { width: 100%; height: 100%; object-fit: cover; }

.rank-info {
  display: flex; flex-direction: column; gap: 0.3rem; min-width: 0;
}
.rank-name {
  font-size: 0.92rem; font-weight: 500; color: var(--text-muted);
  letter-spacing: 0.05em;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.rank-jp {
  display: inline-flex; align-items: center; gap: 8px;
  font-size: 1.25rem; color: var(--pink);
  letter-spacing: 0.08em; font-weight: 700;
  line-height: 1.2;
}
.rank-jp .reward-mini {
  width: 24px; height: 24px;
  border-radius: 5px; overflow: hidden;
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--gold-bg);
  border: 1px solid rgba(184,146,63,0.45);
  font-size: 1.1rem; line-height: 1;
}
.rank-jp .reward-mini img { width: 100%; height: 100%; object-fit: cover; }
.rank-gap {
  font-size: 0.72rem; color: var(--text-muted);
  letter-spacing: 0.05em; text-align: right;
  white-space: nowrap;
}
.rank-gap .gap-num {
  font-family: var(--font-en); font-weight: 700; color: var(--gold);
}
.rank-spoon {
  font-family: var(--font-en); font-size: 1.4rem; font-weight: 800;
  color: var(--text); letter-spacing: 0.02em;
  font-variant-numeric: tabular-nums;
  text-align: right; min-width: 110px;
}
.rank-spoon .unit { font-size: 0.62rem; color: var(--pink); margin-left: 0.3rem; letter-spacing: 0.2em; font-weight: 600; }

@media (max-width: 700px) {
  .rank-row { grid-template-columns: 44px 38px 1fr auto; gap: 0.8rem; padding: 0.8rem; }
  .rank-position { font-size: 1.3rem; }
  .rank-icon { width: 38px; height: 38px; font-size: 1.3rem; }
  .rank-spoon { font-size: 0.95rem; min-width: auto; }
  .rank-gap { display: none; }
  .rank-name { font-size: 0.85rem; }
  .rank-jp { font-size: 0.6rem; }
}

.empty-msg {
  text-align: center; padding: 4rem 1rem;
  font-size: 0.9rem; color: var(--text-muted);
  letter-spacing: 0.05em;
  background: var(--card); border: 1px dashed var(--border); border-radius: 8px;
}

/* ===== 報酬 ===== */
.rewards-section { background: var(--navy); }
.rewards-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 1.2rem;
}
.reward-card {
  position: relative;
  background: rgba(255,255,255,0.025);
  border: 1px solid rgba(255,255,255,0.06);
  border-radius: 4px;
  padding: 2rem 1.4rem 1.4rem;
  text-align: center;
  transition: all 0.4s cubic-bezier(0.16,1,0.3,1);
  overflow: hidden;
}
.reward-card::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
  background: var(--pink); opacity: 0.5;
}
.reward-card:hover {
  border-color: var(--pink);
  background: rgba(232,99,138,0.06);
  transform: translateY(-4px);
}
.reward-rank {
  font-family: var(--font-en); font-size: 0.6rem; font-weight: 700;
  letter-spacing: 0.4em; color: var(--pink);
  text-transform: uppercase; margin-bottom: 1rem;
}
.reward-icon {
  font-size: 2.6rem; margin-bottom: 0.8rem; line-height: 1;
}
.reward-name {
  font-size: 1.1rem; font-weight: 700; color: var(--white);
  letter-spacing: 0.08em; margin-bottom: 0.6rem;
}
.reward-threshold {
  font-family: var(--font-en); font-size: 0.95rem; font-weight: 700;
  color: var(--gold); margin-bottom: 1rem; letter-spacing: 0.04em;
}
.reward-threshold .unit { font-size: 0.55rem; color: var(--gold); margin-left: 0.2rem; letter-spacing: 0.2em; }
.reward-desc {
  font-size: 0.78rem; color: rgba(255,255,255,0.55);
  line-height: 1.8; min-height: 4em;
  letter-spacing: 0.04em;
  margin-bottom: 1rem;
}
.reward-achievers {
  display: inline-flex; align-items: center; gap: 0.4rem;
  border-top: 1px solid rgba(255,255,255,0.08);
  padding-top: 0.9rem;
  margin-top: 0.4rem;
  font-size: 0.7rem; color: rgba(255,255,255,0.5);
  letter-spacing: 0.08em;
}
.reward-achievers .num {
  font-family: var(--font-en); font-weight: 800; color: var(--pink);
  font-size: 1rem;
}

/* ===== 検索 ===== */
.search-section { background: linear-gradient(180deg, var(--navy), #07101c); }
.search-box {
  position: relative; max-width: 580px; margin: 0 auto;
}
.search-input {
  width: 100%;
  font-family: inherit; font-size: 1rem;
  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(255,255,255,0.1);
  color: var(--white);
  padding: 1.1rem 1.4rem 1.1rem 3rem;
  border-radius: 4px;
  outline: none;
  letter-spacing: 0.05em;
  transition: all 0.3s;
}
.search-input::placeholder { color: rgba(255,255,255,0.3); }
.search-input:focus {
  border-color: var(--pink);
  background: rgba(232,99,138,0.04);
  box-shadow: 0 0 0 3px rgba(232,99,138,0.1);
}
.search-icon {
  position: absolute; left: 1.1rem; top: 50%; transform: translateY(-50%);
  color: var(--pink); pointer-events: none;
}

.search-result {
  margin-top: 1.4rem;
  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(232,99,138,0.2);
  border-radius: 6px;
  padding: 2rem;
  display: none;
}
.search-result.show { display: block; animation: fadeUp 0.4s cubic-bezier(0.16,1,0.3,1); }
@keyframes fadeUp { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:translateY(0); } }
.search-result-empty {
  text-align: center; color: rgba(255,255,255,0.4);
  font-size: 0.85rem; padding: 0.6rem 0;
}
.search-user {
  display: flex; align-items: center; gap: 1.2rem;
  margin-bottom: 1.4rem;
}
.search-user-icon {
  width: 64px; height: 64px;
  border-radius: 50%; overflow: hidden;
  background: var(--charcoal); border: 1px solid var(--pink);
  display: flex; align-items: center; justify-content: center;
  font-size: 2rem; flex-shrink: 0;
}
.search-user-icon img { width: 100%; height: 100%; object-fit: cover; }
.search-user-info { display: flex; flex-direction: column; gap: 0.2rem; min-width: 0; }
.search-user-name {
  font-size: 1.2rem; font-weight: 700; color: var(--white);
  letter-spacing: 0.05em;
}
.search-user-rank {
  font-family: var(--font-en); font-size: 0.65rem; font-weight: 700;
  letter-spacing: 0.3em; color: var(--pink); text-transform: uppercase;
}
.search-spoon {
  font-family: var(--font-en); font-size: 1.6rem; font-weight: 800;
  color: var(--gold); letter-spacing: 0.02em; margin-bottom: 0.4rem;
}
.search-spoon .unit { font-size: 0.65rem; color: var(--gold); margin-left: 0.25rem; letter-spacing: 0.2em; }
.search-progress-label {
  font-size: 0.75rem; color: rgba(255,255,255,0.5);
  margin-bottom: 0.5rem; letter-spacing: 0.05em;
}
.search-progress-label .next-rank { color: var(--pink-soft); font-weight: 600; }
.search-progress-label .remain { color: var(--gold); font-weight: 600; }
.search-progressbar {
  width: 100%; height: 8px;
  background: rgba(255,255,255,0.06); border-radius: 4px;
  overflow: hidden;
}
.search-progressbar-fill {
  height: 100%; background: linear-gradient(90deg, var(--pink), var(--gold));
  border-radius: 4px; transition: width 0.6s cubic-bezier(0.16,1,0.3,1);
  position: relative;
}
.search-progressbar-fill::after {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
  animation: shimmerBar 2.5s infinite;
}
@keyframes shimmerBar { 0% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }

/* ===== ランキング行のガチャ獲得バッジ ===== */
.rank-gacha {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 0.78rem; color: var(--pink); font-weight: 600;
  letter-spacing: 0.04em;
}
.rank-gacha .gacha-icon { font-size: 0.95rem; }
.rank-gacha .gacha-count { font-family: var(--font-en); font-weight: 800; font-size: 0.95rem; color: var(--pink-deep); }
.rank-gacha .gacha-rem { color: var(--gold-deep); font-size: 0.7rem; margin-left: 0.2rem; }

/* 表彰台のガチャ獲得バッジ */
.podium-gacha {
  display: inline-block;
  font-size: 0.78rem; color: var(--pink-deep);
  letter-spacing: 0.05em;
  margin-bottom: 0.6rem;
  padding: 0.3rem 0.8rem;
  border-radius: 999px;
  background: var(--pink-bg);
  border: 1px solid rgba(214,85,122,0.3);
}
.podium-gacha strong { font-family: var(--font-en); font-size: 0.95rem; }
.podium-gacha .rem { color: var(--gold-deep); margin-left: 0.4rem; font-weight: 600; }
.podium-card.gold .podium-gacha { font-size: 0.85rem; padding: 0.4rem 1rem; }

/* ===== レアリティカラー ===== */
.rarity-n  { --rare: #6b7280; --rare-bg: #f1f1ee; --rare-border: rgba(107,114,128,0.35); }
.rarity-r  { --rare: #4a90b8; --rare-bg: #eaf3f9; --rare-border: rgba(74,144,184,0.35); }
.rarity-sr { --rare: #b8633f; --rare-bg: #fbeee4; --rare-border: rgba(184,99,63,0.4); }
.rarity-ssr { --rare: #b04173; --rare-bg: #fbe9f0; --rare-border: rgba(176,65,115,0.45); }

/* ===== ガチャ景品紹介セクション（ガチャタイプ別） ===== */
.rewards-section { background: linear-gradient(180deg, var(--bg-warm) 0%, var(--bg-gold) 100%); }
.rewards-list {
  display: flex; flex-direction: column; gap: 1.4rem;
}
.prize-type-section {
  background: var(--card);
  border: 1.5px solid var(--border);
  border-radius: 12px;
  padding: 1.4rem;
  box-shadow: var(--shadow-sm);
  border-top: 4px solid var(--accent, var(--pink));
}
.prize-type-header {
  display: flex; align-items: center; gap: 1rem;
  margin-bottom: 1rem;
  padding-bottom: 0.9rem;
  border-bottom: 1px dashed var(--border);
}
.prize-type-icon {
  width: 56px; height: 56px;
  border-radius: 50%;
  background: color-mix(in srgb, var(--accent, var(--pink)) 12%, white);
  border: 2px solid var(--accent, var(--pink));
  display: flex; align-items: center; justify-content: center;
  font-size: 2rem; line-height: 1;
  overflow: hidden;
}
.prize-type-icon img { width: 100%; height: 100%; object-fit: cover; }
.prize-type-meta { display: flex; flex-direction: column; }
.prize-type-name {
  font-size: 1.2rem; font-weight: 700; color: var(--text);
  letter-spacing: 0.06em;
}
.prize-type-cost {
  font-family: var(--font-en); font-weight: 700; font-size: 0.85rem;
  color: var(--accent, var(--pink));
  letter-spacing: 0.04em;
  margin-top: 0.15rem;
}
.prize-type-list {
  display: flex; flex-direction: column; gap: 0.5rem;
}
.prize-item {
  display: grid;
  grid-template-columns: 60px 64px 1fr auto;
  gap: 1.4rem;
  align-items: center;
  padding: 1.1rem 1.6rem;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 8px;
  transition: all 0.2s cubic-bezier(0.16,1,0.3,1);
  box-shadow: var(--shadow-sm);
  position: relative; overflow: hidden;
}
.prize-item::before {
  content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px;
  background: var(--rare);
}
.prize-item:hover {
  border-color: var(--rare);
  background: var(--rare-bg);
  transform: translateX(4px);
}
.prize-rarity {
  font-family: var(--font-en); font-size: 0.85rem; font-weight: 800;
  letter-spacing: 0.18em; color: var(--rare);
  text-transform: uppercase;
  text-align: center;
  padding: 0.35rem 0;
  border: 1.5px solid var(--rare);
  border-radius: 4px;
  background: var(--card);
}
.prize-icon {
  width: 64px; height: 64px;
  border-radius: 8px;
  background: var(--rare-bg);
  border: 1.5px solid var(--rare-border);
  display: flex; align-items: center; justify-content: center;
  font-size: 2.2rem; line-height: 1;
  overflow: hidden;
  flex-shrink: 0;
}
.prize-icon img { width: 100%; height: 100%; object-fit: cover; }
.prize-meta { display: flex; flex-direction: column; gap: 0.3rem; min-width: 0; }
.prize-name {
  font-size: 1.15rem; font-weight: 700; color: var(--text);
  letter-spacing: 0.04em;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.prize-text {
  font-size: 0.82rem;
  color: var(--text-muted);
  letter-spacing: 0.03em;
  line-height: 1.6;
}
.prize-prob {
  font-family: var(--font-en);
  text-align: right; min-width: 90px;
}
.prize-prob .above { display: block; font-size: 0.55rem; color: var(--text-muted); letter-spacing: 0.25em; margin-bottom: 0.2rem; }
.prize-prob .num { font-size: 1.5rem; font-weight: 800; color: var(--rare); }
.prize-prob .unit { font-size: 0.7rem; color: var(--rare); margin-left: 0.15rem; }

@media (max-width: 700px) {
  .prize-item {
    grid-template-columns: 48px 56px 1fr auto;
    gap: 0.6rem; padding: 0.85rem 1rem;
  }
  .prize-rarity { font-size: 0.65rem; padding: 0.25rem 0; }
  .prize-icon { width: 56px; height: 56px; font-size: 1.7rem; }
  .prize-name { font-size: 1rem; }
  .prize-prob .num { font-size: 1.1rem; }
}

@media (max-width: 700px) {
  .reward-item {
    grid-template-columns: 56px 1fr auto;
    grid-template-rows: auto auto;
    gap: 0.4rem 0.9rem;
    padding: 0.9rem 1rem;
  }
  .reward-no { display: none; }
  .reward-icon { grid-row: 1 / span 2; align-self: center; }
  .reward-rank-name { grid-row: 1; grid-column: 2; }
  .reward-threshold { grid-row: 1; grid-column: 3; font-size: 0.95rem; min-width: auto; }
  .reward-meta { display: contents; }
  .reward-text { grid-row: 2; grid-column: 2 / span 2; font-size: 0.78rem; }
}

/* ===== 実況フィード（タイムライン） ===== */
.timeline-section {
  background: linear-gradient(180deg, var(--bg-warm) 0%, var(--bg) 100%);
  padding: 6rem 0;
}
.timeline-feed {
  display: flex; flex-direction: column; gap: 0.5rem;
  max-height: 520px;
  overflow-y: auto;
  padding-right: 6px;
  scrollbar-width: thin;
  scrollbar-color: var(--border) transparent;
}
.timeline-feed::-webkit-scrollbar { width: 6px; }
.timeline-feed::-webkit-scrollbar-thumb { background: var(--border); border-radius: 6px; }
.timeline-entry {
  display: grid; grid-template-columns: 76px 40px 1fr; gap: 1rem;
  align-items: center;
  padding: 0.85rem 1.1rem;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 8px;
  box-shadow: var(--shadow-sm);
  transition: all 0.2s;
}
.timeline-entry:hover { border-color: var(--pink); transform: translateX(3px); }
.timeline-entry.promote {
  background: linear-gradient(90deg, var(--pink-bg) 0%, var(--card) 60%);
  border-color: rgba(214,85,122,0.35);
}
.timeline-entry.donate {
  background: linear-gradient(90deg, var(--gold-bg) 0%, var(--card) 60%);
  border-color: rgba(184,146,63,0.35);
}
.timeline-time {
  font-family: var(--font-en); font-size: 0.7rem; color: var(--text-muted);
  letter-spacing: 0.06em; text-align: right;
  font-variant-numeric: tabular-nums;
}
.timeline-icon {
  width: 40px; height: 40px;
  border-radius: 50%;
  background: var(--bg-warm);
  border: 1px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  font-size: 1.4rem; line-height: 1;
  overflow: hidden;
}
.timeline-icon img { width: 100%; height: 100%; object-fit: cover; }
.timeline-msg {
  font-size: 0.9rem; color: var(--text);
  letter-spacing: 0.04em; line-height: 1.6;
}
.timeline-msg .name { font-weight: 700; color: var(--text); }
.timeline-msg .amount { font-family: var(--font-en); font-weight: 800; color: var(--gold-deep); }
.timeline-msg .rank-name { font-weight: 700; color: var(--pink); }
.timeline-msg .note { color: var(--text-muted); font-size: 0.82em; margin-left: 0.3em; }
.timeline-msg .label-promote,
.timeline-msg .label-donate {
  display: inline-block;
  font-family: var(--font-en); font-size: 0.6rem; font-weight: 700;
  letter-spacing: 0.18em; padding: 0.2rem 0.55rem; border-radius: 4px;
  margin-right: 0.5rem; text-transform: uppercase;
  vertical-align: 1px;
}
.timeline-msg .label-promote { color: var(--pink); background: var(--pink-bg); }
.timeline-msg .label-donate { color: var(--gold-deep); background: var(--gold-bg); }
.timeline-empty {
  text-align: center; padding: 3rem 1rem;
  color: var(--text-muted); font-size: 0.9rem;
  background: var(--card); border: 1px dashed var(--border); border-radius: 8px;
}

@media (max-width: 600px) {
  .timeline-entry { grid-template-columns: 60px 36px 1fr; gap: 0.6rem; padding: 0.7rem 0.9rem; }
  .timeline-time { font-size: 0.62rem; }
  .timeline-msg { font-size: 0.8rem; }
}

/* ===== ヘッダーのユーザーセッション表示 ===== */
.user-session {
  display: flex; align-items: center; gap: 0.6rem;
  font-size: 0.75rem;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 999px;
  padding: 0.3rem 0.4rem 0.3rem 1rem;
  box-shadow: var(--shadow-sm);
  flex-shrink: 0;
}
.user-session.empty { display: none; }
.user-session .me {
  font-weight: 600; color: var(--text);
  letter-spacing: 0.05em;
}
.user-session .me .user-icon {
  display: inline-flex; align-items: center; justify-content: center;
  width: 24px; height: 24px;
  border-radius: 50%; overflow: hidden;
  background: var(--bg-warm); border: 1px solid var(--border);
  font-size: 0.95rem; vertical-align: middle; margin-right: 0.4rem;
}
.user-session .me .user-icon img { width: 100%; height: 100%; object-fit: cover; }
.user-session .logout {
  font-family: var(--font-en); font-size: 0.6rem; font-weight: 700;
  color: var(--text-muted); letter-spacing: 0.18em;
  text-transform: uppercase;
  padding: 0.4rem 0.8rem; border-radius: 999px;
  background: var(--bg-warm); border: none; cursor: pointer;
  transition: all 0.15s;
}
.user-session .logout:hover { background: var(--pink-bg); color: var(--pink-deep); }
@media (max-width: 800px) {
  .user-session { padding-left: 0.6rem; font-size: 0.7rem; }
  nav.top-nav { display: none; }
}

/* ===== ガチャセクション ===== */
.gacha-section { background: linear-gradient(180deg, var(--bg-warm) 0%, var(--bg-pink) 100%); }

.gacha-login {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 2rem;
  text-align: center;
  max-width: 520px;
  margin: 0 auto;
  box-shadow: var(--shadow-sm);
}
.gacha-login h3 {
  font-size: 1.1rem; font-weight: 700; margin-bottom: 0.5rem;
  color: var(--text); letter-spacing: 0.06em;
}
.gacha-login p {
  font-size: 0.85rem; color: var(--text-muted);
  margin-bottom: 1.4rem; line-height: 1.7;
}
.gacha-login-form {
  display: flex; gap: 0.5rem; max-width: 420px; margin: 0 auto;
}
.gacha-login-input {
  flex: 1;

  const def = getDefaultData();
  parsed.settings = Object.assign({}, def.settings, parsed.settings || {});
  if (!Array.isArray(parsed.settings.gachaTypes) || parsed.settings.gachaTypes.length === 0) {
    parsed.settings.gachaTypes = DEFAULT_GACHA_TYPES;
  }
  if (!Array.isArray(parsed.users)) parsed.users = [];
  for (const u of parsed.users) {
    if (typeof u.spentSpoon !== 'number') u.spentSpoon = 0;
    if (!Array.isArray(u.gachaHistory)) u.gachaHistory = [];
  }
  return parsed;
}
async function fetchRemoteData() {
  try {
    const res = await fetch('/api/data', { cache: 'no-store' });
    if (!res.ok) throw new Error('fetch failed: ' + res.status);
    const json = await res.json();
    _cache = normalizeData(json);
    return _cache;
  } catch (e) {
    console.warn('fetchRemoteData 失敗:', e);
    if (!_cache) _cache = getDefaultData();
    return _cache;
  }
}
function loadData() {
  return _cache || getDefaultData();
}

// 利用可能 Spoon = 累計 - 消費
function availableSpoon(user) {
  return Math.max(0, (user.totalSpoon || 0) - (user.spentSpoon || 0));
}
// 各ガチャタイプの引ける回数
function pullsAvailable(user, type) {
  const cost = Number(type.cost) || 0;
  if (cost <= 0) return 0;
  return Math.floor(availableSpoon(user) / cost);
}

// ランク判定：累計Spoonからランク情報を返す
function getRankByAmount(amount, ranks) {
  let currentIdx = 0;
  for (let i = 0; i < ranks.length; i++) {
    if (amount >= ranks[i].threshold) currentIdx = i;
  }
  const current = ranks[currentIdx];
  const next = ranks[currentIdx + 1] || null;
  const progressPct = next
    ? Math.max(0, Math.min(100, ((amount - current.threshold) / (next.threshold - current.threshold)) * 100))
    : 100;
  const remaining = next ? Math.max(0, next.threshold - amount) : 0;
  return { currentIdx, current, next, progressPct, remaining };
}

function getRankAchievers(rankIndex, users, ranks) {
  return users.filter(u => {
    const r = getRankByAmount(u.totalSpoon || 0, ranks);
    return r.currentIdx >= rankIndex;
  });
}

function fmt(n) {
  return Number(n || 0).toLocaleString('ja-JP');
}
// 表示用：99,999 を超えたら "99,999+" に省略（実データは変えない）
const SPOON_DISPLAY_CAP = 99999;
function fmtCap(n) {
  const v = Number(n || 0);
  return v > SPOON_DISPLAY_CAP ? '99,999+' : v.toLocaleString('ja-JP');
}

function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}

function renderUserIcon(user, size) {
  if (user.iconType === 'image' && user.icon) {
    return `<img src="${escapeHtml(user.icon)}" alt="">`;
  }
  return escapeHtml(user.icon || '👤');
}
// 報酬アイコン：data:image で始まるなら画像、それ以外は絵文字テキストとして描画
function renderRewardIcon(value) {
  if (typeof value === 'string' && value.startsWith('data:image')) {
    return `<img src="${escapeHtml(value)}" alt="">`;
  }
  return escapeHtml(value || '🎁');
}

// ガチャ実行は /api/pull 経由（抽選はサーバ側、ユーザーは結果のみ受け取る）
async function doGachaPull(userId, gachaTypeId) {
  const btn = document.querySelector(`.candy-pull-btn[data-type-id="${gachaTypeId}"]`);
  const origText = btn ? btn.textContent : '';
  if (btn) { btn.disabled = true; btn.textContent = '抽選中…'; }
  try {
    const res = await fetch('/api/pull', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ userId, gachaTypeId }),
    });
    const json = await res.json();
    if (!res.ok || !json.ok) {
      const msg = (json && json.error) || '抽選に失敗しました';
      if (msg === 'not enough spoon') alert('Spoon が足りません。');
      else if (msg === 'user not found') { alert('ユーザーが見つかりません。'); setCurrentUserId(null); }
      else alert('エラー: ' + msg);
      await fetchRemoteData();
      renderAll();
      return;
    }
    await fetchRemoteData();
    showGachaResult(json.prize);
    renderAll();
  } catch (e) {
    alert('通信エラー：' + (e.message || e));
    if (btn) { btn.disabled = false; btn.textContent = origText; }
  }
}

// 実況フィード（最近の加算と昇進をまとめて時系列で表示）
function relativeTime(ts) {
  const diff = Date.now() - ts;
  if (diff < 60000) return 'たった今';
  if (diff < 3600000) return `${Math.floor(diff / 60000)}分前`;
  if (diff < 86400000) return `${Math.floor(diff / 3600000)}時間前`;
  if (diff < 7 * 86400000) return `${Math.floor(diff / 86400000)}日前`;
  const d = new Date(ts);
  return `${d.getMonth()+1}/${d.getDate()}`;
}

function buildActivityFeed(data) {
  const entries = [];
  for (const u of data.users) {
    // 加算イベント
    for (const h of (u.history || [])) {
      entries.push({
        type: 'donate',
        timestamp: h.timestamp,
        user: u, amount: h.amount, note: h.note || '',
      });
    }
    // ガチャ実行イベント
    for (const g of (u.gachaHistory || [])) {
      entries.push({
        type: 'gacha',
        timestamp: g.timestamp,
        user: u,
        prizeName: g.prizeName,
        rarity: g.rarity || 'N',
        prizeIcon: g.prizeIcon || '🎁',
        prizeIconType: g.prizeIconType || 'emoji',
        gachaTypeName: g.gachaTypeName || '',
      });
    }
  }
  return entries.sort((a, b) => b.timestamp - a.timestamp).slice(0, 30);
}

function renderCountdown(data) {
  const end = new Date(data.settings.eventEndDate).getTime();
  const start = new Date(data.settings.eventStartDate).getTime();
  const now = Date.now();
  const cd = document.getElementById('countdown');

  let target, diff;
  if (now < start) {
    target = start; diff = start - now;
    cd.classList.remove('ended');
  } else if (now < end) {
    target = end; diff = end - now;
    cd.classList.remove('ended');
  } else {
    diff = 0;
    cd.classList.add('ended');
  }

  const days = Math.floor(diff / 86400000);
  const hours = Math.floor((diff % 86400000) / 3600000);
  const mins = Math.floor((diff % 3600000) / 60000);
  const secs = Math.floor((diff % 60000) / 1000);
  document.getElementById('cdDays').textContent = String(days).padStart(2, '0');
  document.getElementById('cdHours').textContent = String(hours).padStart(2, '0');
  document.getElementById('cdMinutes').textContent = String(mins).padStart(2, '0');
  document.getElementById('cdSeconds').textContent = String(secs).padStart(2, '0');
}

function renderRanking(data) {
  const list = document.getElementById('rankingList');
  list.innerHTML = '';

  const sorted = data.users.slice().sort((a, b) => (b.totalSpoon || 0) - (a.totalSpoon || 0));
  const top10 = sorted.slice(0, 10);

  if (top10.length === 0) {
    list.innerHTML = `<div class="empty-msg">まだランキングに表示できる社員がいません</div>`;
    return;
  }

  // 1〜3位：表彰台
  const podium = top10.slice(0, 3);
  if (podium.length > 0) {
    list.appendChild(buildPodium(podium));
  }

  // 4位以下：通常リスト
  const rest = top10.slice(3);
  if (rest.length > 0) {
    const label = document.createElement('div');
    label.className = 'ranking-list-label';
    label.textContent = '4位以下';
    list.appendChild(label);

    for (let idx = 0; idx < rest.length; idx++) {
      const overallIdx = idx + 3;
      const u = rest[idx];
      const avail = availableSpoon(u);
      const above = sorted[overallIdx - 1];
      const gap = above ? Math.max(0, (above.totalSpoon || 0) - (u.totalSpoon || 0)) : 0;

      const row = document.createElement('div');
      row.className = 'rank-row';
      row.innerHTML = `
        <div class="rank-position">${overallIdx + 1}<span class="ord">th</span></div>
        <div class="rank-icon">${renderUserIcon(u)}</div>
        <div class="rank-info">
          <div class="rank-name">${escapeHtml(u.name)}</div>
          <div class="rank-gacha">
            🍬 残 <span class="gacha-count">${fmtCap(avail)}</span> Spoon
          </div>
        </div>
        <div class="rank-gap">${gap > 0 ? `あと <span class="gap-num">${fmtCap(gap + 1)}</span> Spoonで ${overallIdx}位` : '——'}</div>
        <div class="rank-spoon">${fmtCap(u.totalSpoon || 0)}<span class="unit">SPOON</span></div>
      `;
      list.appendChild(row);
    }
  }
}

  const wrap = document.createElement('div');
  wrap.className = 'podium';

  if (top3[1]) order.push({ user: top3[1], pos: 2, tier: 'silver', medal: '🥈' });

  if (top3[2]) order.push({ user: top3[2], pos: 3, tier: 'bronze', medal: '🥉' });

  for (const item of order) {
    const u = item.user;
    const avail = availableSpoon(u);
    const card = document.createElement('div');
    card.className = `podium-card ${item.tier}`;
    card.innerHTML = `
      <div class="podium-medal">${item.medal}</div>
      <div class="podium-position-en">No. ${String(item.pos).padStart(2,'0')}</div>
      <div class="podium-icon">${renderUserIcon(u)}</div>
      <div class="podium-name">${escapeHtml(u.name)}</div>
      <div class="podium-spoon">${fmtCap(u.totalSpoon || 0)}<span class="unit">SPOON</span></div>
      <div class="podium-gacha">
        🍬 残 <strong>${fmtCap(avail)}</strong> Spoon
      </div>
      <div class="podium-base">
        <span class="small">PODIUM</span>${item.pos}
      </div>
    `;
    wrap.appendChild(card);
  }
  return wrap;
}


// ============================================================
// メイン描画ループ
// ============================================================
function renderAll() {
  const data = loadData();
  renderUserSession(data);
  renderHero(data);
  renderCountdown(data);
  renderRanking(data);
  renderTimeline(data);
  renderGacha(data);
  renderGachaPrizes(data);
}

// ============================================================
// イベント
// ============================================================
function setupHeader() {
  const header = document.getElementById('header');
  window.addEventListener('scroll', () => {
    header.classList.toggle('scrolled', window.scrollY > 30);
  });
}

function setupCursor() {
  const dot = document.getElementById('cursorDot');
  const ring = document.getElementById('cursorRing');
  let rx = 0, ry = 0, mx = 0, my = 0;
  document.addEventListener('mousemove', (e) => {
    mx = e.clientX; my = e.clientY;
    dot.style.transform = `translate(${mx - 3}px, ${my - 3}px)`;
  });
  function loop() {
    rx += (mx - rx) * 0.2;
    ry += (my - ry) * 0.2;
    ring.style.transform = `translate(${rx - 16}px, ${ry - 16}px)`;
    requestAnimationFrame(loop);
  }
  loop();
}

function setupSync() {
  // タブが見えているときだけサーバから再取得（タブを切ってる間は通信しない＝無料枠を消費しない）
  setInterval(async () => {
    if (document.visibilityState !== 'visible') return;
    await fetchRemoteData();
    renderAll();
  }, POLL_INTERVAL_MS);
  // タブ復帰時に即時再取得
  document.addEventListener('visibilitychange', async () => {
    if (document.visibilityState === 'visible') {
      await fetchRemoteData();
      renderAll();
    }
  });
  // カウントダウンは1秒ごとにキャッシュから再描画（通信なし）
  setInterval(() => {
    renderCountdown(loadData());
  }, 1000);
}

// ============================================================
// 起動
// ============================================================
setupHeader();
setupCursor();
setupGachaModal();
// 初回はリモートからデータ取得後に描画
fetchRemoteData().then(() => {
  renderAll();
  // ヒーローをフェードイン（初期表示の文言ちらつきを防ぐ）
  const heroInner = document.querySelector('.hero-inner');
  if (heroInner) heroInner.classList.add('loaded');
  setupSync();
});
</script>
